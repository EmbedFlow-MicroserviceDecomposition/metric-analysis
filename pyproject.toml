[project]
name = "fyp-cdq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yumeth", email = "yumethsumathipala@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "javalang>=0.13.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "scripts"]
norecursedirs = ["codebases", "references", ".git"]

