[project]
name = "fyp-cdq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yumeth", email = "yumethsumathipala@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "javalang>=0.13.0",
    "jupyterlab>=4.6.4",
    "jupytext>=1.19.6",
    "matplotlib>=3.11.2",
    "notebook>=7.6.3",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src", "scripts"]
norecursedirs = ["codebases", "references", ".git"]

